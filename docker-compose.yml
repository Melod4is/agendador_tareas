services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: contraseña
      POSTGRES_DB: agendador
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - postgres_network
networks:
  postgres_network:
    driver: bridge

volumes:
  postgres_data:
  
